server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames, so a stale copy can never be served.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app uses BrowserRouter, so /team, /shifts/3, /payroll/7 and friends are
    # client-side routes with no file behind them. Without this fallback a refresh
    # or a pasted deep link would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or a rebuilt app keeps serving the old
    # asset hashes to anyone who visited before.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
